[package]
name = "kprobe"
authors = ["Linfeng Chen <chenlinfeng25@outlook.com>"]
version = "0.1.0"
edition = "2024"
description = "A no_std Rust probe infrastructure crate for kprobe, kretprobe, and uprobe on multiple architectures."
homepage = "https://github.com/Starry-OS/kprobe"
repository = "https://github.com/Starry-OS/kprobe"
readme = "README.en.md"
keywords = ["kprobe", "uprobe", "kernel", "tracing", "no-std"]


[dependencies]
log = "0.4"
lock_api = "0.4"
cfg-if = "1.0"

[target.'cfg(target_arch = "x86_64")'.dependencies]
yaxpeax-x86 = { version = "2", default-features = false, features = ["fmt"] }
yaxpeax-arch = { version = "0.3", default-features = false }
